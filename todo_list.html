<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center">Task Management System</h2>

        <!-- User Registration -->
        <div class="mb-4">
            <input type="text" id="userInput" class="form-control mb-2" placeholder="Enter your name to register">
            <button onclick="registerUser()" class="btn btn-success">Register</button>
        </div>

        <!-- Task Input -->
        <div class="input-group mt-4">
            <input type="text" id="taskInput" class="form-control" placeholder="Enter new task">
            <select id="assignedToInput" class="form-control">
                <option value="">Assign to a user</option>
            </select>
            <button onclick="addTask()" class="btn btn-primary">Add Task</button>
        </div>

        <!-- Task List -->
        <h3 class="mt-4">Tasks</h3>
        <ul id="taskList" class="list-group"></ul>

    </div>

    <script>
        //Load the users and registered users
        document.addEventListener("DOMContentLoaded", () => {
            loadUsers();
            loadTasks();
        });

        function registerUser() {
            let username = document.getElementById("userInput").value.trim();
            if (!username) return alert("Enter a valid username!");

            let users = JSON.parse(localStorage.getItem("users")) || [];
            if (!users.includes(username)) {
                users.push(username);
                localStorage.setItem("users", JSON.stringify(users));
            }
            document.getElementById("userInput").value = "";
            loadUsers();
        }

        function addTask() {
            let taskText = document.getElementById("taskInput").value.trim();
            let assignedTo = document.getElementById("assignedToInput").value;

            if (!taskText) return alert("Enter a task!");
            if (!assignedTo) return alert("Select a user to assign the task!");

            let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
            tasks.push({ text: taskText, assignedTo, status: "pending", comments: [] });
            localStorage.setItem("tasks", JSON.stringify(tasks));

            sendNotification(assignedTo, `New Task Assigned: "${taskText}"`);
            document.getElementById("taskInput").value = "";
            document.getElementById("assignedToInput").value = "";
            loadTasks();
        }

        function loadTasks() {
            let taskList = document.getElementById("taskList");
            taskList.innerHTML = "";
            let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

            tasks.forEach((task, index) => {
                if (!task.comments) task.comments = [];

                let listItem = document.createElement("li");
                listItem.className = "list-group-item";

                listItem.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="${task.status === 'completed' ? 'text-decoration-line-through' : ''}">
                            ${task.text} (Assigned to: ${task.assignedTo})
                        </span>
                        <div>
                            <button class="btn btn-success btn-sm me-2" onclick="completeTask(${index})">Complete</button>
                            <button class="btn btn-warning btn-sm me-2" onclick="editTask(${index})">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteTask(${index})">Delete</button>
                        </div>
                    </div>
                    <div class="mt-2">
                        <input type="text" id="commentInput${index}" class="form-control mb-2" placeholder="Add a comment">
                        <button class="btn btn-info btn-sm" onclick="addComment(${index})">Add Comment</button>
                    </div>
                    <ul id="commentList${index}" class="list-group mt-2">${renderComments(task.comments, index)}</ul>
                `;

                taskList.appendChild(listItem);
            });
        }

        function completeTask(index) {
            let tasks = JSON.parse(localStorage.getItem("tasks"));
            tasks[index].status = "completed";
            localStorage.setItem("tasks", JSON.stringify(tasks));
            loadTasks();
        }

        //Delete Task
        function deleteTask(index) {
            let tasks = JSON.parse(localStorage.getItem("tasks"));
            tasks.splice(index, 1);
            localStorage.setItem("tasks", JSON.stringify(tasks));
            loadTasks();
        }
    </script>
</body>
</html>
